<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEEHOASG · UI V3 Preview</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff9ef,#fff2f6 48%,#eef9f4);color:#2c2724}.preview-boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.preview-card{display:flex;align-items:center;gap:14px;padding:18px 22px;border-radius:24px;background:rgba(255,255,255,.88);box-shadow:0 24px 70px rgba(74,49,42,.12)}.preview-mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#2e705c,#ef8998);color:white;font-weight:800;font-size:20px}.preview-card b{display:block}.preview-card small{color:#887a73}
</style>
</head>
<body>
<div class="preview-boot"><div class="preview-card"><div class="preview-mark">M</div><div><b>Đang mở Meehoa UI V3</b><small>Preview độc lập · không ảnh hưởng web chính</small></div></div></div>
<script>
(async function(){
  try{
    var r=await fetch('/index.html?preview-base='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Không tải được app gốc');
    var html=await r.text();
    html=html.replace(/<head>/i,'<head><base href="/">');
    html=html.replace(/<\/head>/i,'<link rel="stylesheet" href="/preview/assets/ui-v3.css?v=3.3"><link rel="stylesheet" href="/preview/assets/ui-v3-fix.css?v=3.3"><link rel="stylesheet" href="/preview/assets/ui-v3-hotfix.css?v=3.3"></head>');
    html=html.replace(/<\/body>/i,'<script src="/preview/assets/ui-v3.js?v=3.3"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="preview-boot"><div class="preview-card"><div class="preview-mark">!</div><div><b>Preview chưa tải được</b><small>'+String(e&&e.message||e)+'</small></div></div></div>';
  }
})();
</script>
</body>
</html>
