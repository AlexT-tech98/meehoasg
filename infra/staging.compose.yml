name: meehoa-pr39-qa
services:
  db:
    image: postgres:17.6-alpine
    container_name: meehoa-qa-db
    environment:
      POSTGRES_PASSWORD: ${QA_DB_PASSWORD:?generate local config first}
    ports: ["127.0.0.1:54322:5432"]
    volumes:
      - qa-db:/var/lib/postgresql/data
      - ./staging-bootstrap.sql:/docker-entrypoint-initdb.d/10-qa.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [qa]
  rest:
    image: public.ecr.aws/supabase/postgrest:v14.3
    container_name: meehoa-qa-rest
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://postgres:${QA_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${QA_JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
    ports: ["127.0.0.1:54323:3000"]
    networks: [qa]
  storage:
    image: public.ecr.aws/supabase/storage-api:v1.35.3
    container_name: meehoa-qa-storage
    depends_on:
      db: {condition: service_healthy}
      rest: {condition: service_started}
    environment:
      DATABASE_URL: postgres://postgres:${QA_DB_PASSWORD}@db:5432/postgres
      DATABASE_CONNECTION_TIMEOUT: 30000
      PGOPTIONS: "-c search_path=storage,public"
      POSTGREST_URL: http://rest:3000
      ANON_KEY: ${QA_ANON_KEY}
      SERVICE_KEY: ${QA_SERVICE_KEY}
      AUTH_JWT_SECRET: ${QA_JWT_SECRET}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: qa
      TENANT_ID: qa
      REGION: local
      FILE_SIZE_LIMIT: 5242880
      ENABLE_IMAGE_TRANSFORMATION: "false"
    ports: ["127.0.0.1:54324:5000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes: [qa-storage:/var/lib/storage]
    networks: [qa]
networks:
  qa:
    driver: bridge
volumes:
  qa-db:
  qa-storage:
