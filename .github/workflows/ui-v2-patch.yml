name: UI V2 patch

on:
  push:
    branches: [ui-v2]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v2
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Load the V2 visual layer once.
          link = '<link rel="stylesheet" href="assets/ui-v2.css?v=2">'
          if link not in s:
              marker = '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">'
              s = s.replace(marker, marker + '\n' + link, 1)

          # Search only belongs on screens that actually have searchable order data loaded.
          old = "function goActive() { document.querySelectorAll('[data-p]').forEach(function (x) { return x.classList.toggle('active', x.dataset.p === S.page); }); var t = document.getElementById('pageTitle'), p = pages.find(function (x) { return x[0] === S.page; }) || pages[0]; if (t)\n        t.textContent = p[1]; markMobileMore(); }"
          new = "function goActive() { document.querySelectorAll('[data-p]').forEach(function (x) { return x.classList.toggle('active', x.dataset.p === S.page); }); var t = document.getElementById('pageTitle'), p = pages.find(function (x) { return x[0] === S.page; }) || pages[0]; if (t)\n        t.textContent = p[1]; var searchWrap = document.querySelector('.topbar-search'); if (searchWrap) searchWrap.classList.toggle('hidden', !['orders','production'].includes(S.page)); markMobileMore(); }"
          if old in s:
              s = s.replace(old, new, 1)
          elif "searchWrap.classList.toggle('hidden'" not in s:
              raise SystemExit('goActive signature changed; refusing unsafe patch')

          p.write_text(s)
          PY

      - name: Add strict image bounds
        shell: bash
        run: |
          cat >> assets/ui-v2.css <<'CSS'

          /* audit fix: order imagery must never escape its information container */
          .sample-with-thumb{
            display:grid;
            grid-template-columns:52px minmax(0,1fr);
            gap:10px;
            align-items:start;
            min-width:0;
          }
          .table-thumb,.table-thumb-empty{
            width:52px!important;
            height:52px!important;
            min-width:52px;
            max-width:52px;
            max-height:52px;
            border-radius:12px;
            object-fit:cover;
            overflow:hidden;
            display:grid;
            place-items:center;
          }
          .order-preview{
            display:block;
            width:100%!important;
            height:132px!important;
            max-width:100%;
            max-height:132px!important;
            object-fit:cover;
            border-radius:14px;
            margin:9px 0 10px;
            overflow:hidden;
          }
          .order img,.ops-tile img,.order-card-mobile img,.drawer img{
            max-width:100%;
          }
          .order-card-mobile-thumb{
            width:56px!important;
            height:56px!important;
            min-width:56px;
            max-width:56px;
            max-height:56px;
            object-fit:cover;
          }
          .search-item-thumb{
            width:44px!important;
            height:44px!important;
            min-width:44px;
            max-width:44px;
            max-height:44px;
            object-fit:cover;
          }
          @media(max-width:900px){
            .order-preview{height:116px!important;max-height:116px!important}
            .sample-with-thumb{grid-template-columns:48px minmax(0,1fr)}
            .table-thumb,.table-thumb-empty{width:48px!important;height:48px!important;min-width:48px;max-width:48px;max-height:48px}
          }
          CSS

      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ui-v2.css
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui-v2): hide inactive search and constrain thumbnails [skip ci]"
          git push origin HEAD:ui-v2
