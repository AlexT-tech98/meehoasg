name: Meehoa Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit-local-only
          POSTGRES_DB: audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Harden core money parsing
        run: node scripts/harden-core-money.cjs
      - name: Flatten critical API bootstrap routes
        run: node scripts/flatten-core-bootstrap.cjs
      - name: Build consolidated runtime assets
        run: node scripts/build-runtime.cjs
      - name: Verify committed release artifacts are reproducible
        run: git diff --exit-code
      - name: Run regression suite
        run: node --test tests/*.test.cjs
      - name: Run transactional suite with independent PostgreSQL sessions
        env:
          AUDIT_DATABASE_URL: postgresql://audit:audit-local-only@localhost:5432/audit
        run: node --test tests/atomic-operations.test.cjs
      - name: Generate exact commit release hashes
        run: node scripts/release-manifest.cjs
      - name: Rehearse fixture backup and restore across release migrations
        run: node scripts/rollback-rehearsal.cjs
      - name: Upload release hashes
        uses: actions/upload-artifact@v4
        with:
          name: release-hashes-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/release/
          if-no-files-found: error
      - name: Upload isolated rollback rehearsal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/rollback/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile isolated browser acceptance
        run: node scripts/browser-acceptance.cjs
      - name: Upload browser evidence (synthetic API, not staging E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/browser/
          if-no-files-found: error

  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.5.6'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Create fresh local QA credentials (never uploaded)
        run: node scripts/staging-config.cjs
      - name: Start isolated PostgreSQL 17, PostgREST and Supabase Storage
        run: docker --host=unix:///var/run/docker.sock compose --env-file artifacts/staging/docker.local.env -f infra/staging.compose.yml up -d --wait --wait-timeout 180
      - name: Seed synthetic accounts, orders and environment marker
        run: node scripts/staging-seed.cjs
      - name: Run candidate APIs and QA frontend on loopback
        run: |
          MEEHOA_DENO="$(command -v deno)" DENO_DIR="$RUNNER_TEMP/meehoa-deno-cache" node scripts/staging-run.cjs > artifacts/staging/runtime.local.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/__qa_health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Authenticated API, storage, finance and role acceptance
        run: node scripts/staging-acceptance.cjs
      - name: Real backend desktop and mobile browser acceptance
        env:
          MEEHOA_CHROMIUM: bundled
        run: node scripts/staging-browser.cjs
      - name: Upload sanitized local staging evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/staging-evidence/
          if-no-files-found: error
      - name: Remove disposable CI QA containers and volumes
        if: always()
        run: docker --host=unix:///var/run/docker.sock compose --env-file artifacts/staging/docker.local.env -f infra/staging.compose.yml down -v
