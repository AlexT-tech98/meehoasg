name: Meehoa Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit-local-only
          POSTGRES_DB: audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Harden core money parsing
        run: node scripts/harden-core-money.cjs
      - name: Flatten critical API bootstrap routes
        run: node scripts/flatten-core-bootstrap.cjs
      - name: Build consolidated runtime assets
        run: node scripts/build-runtime.cjs
      - name: Run regression suite
        run: node --test tests/*.test.cjs
      - name: Run transactional suite with independent PostgreSQL sessions
        env:
          AUDIT_DATABASE_URL: postgresql://audit:audit-local-only@localhost:5432/audit
        run: node --test tests/atomic-operations.test.cjs
      - name: Persist generated production cores on same-repo PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          FILES="supabase/functions/meehoasg-api-core/index.js assets/meehoa-core.css assets/meehoa-core.js runtime-metrics.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Generated production cores already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "build: refresh consolidated production cores"
          git push origin HEAD:${{ github.head_ref }}
