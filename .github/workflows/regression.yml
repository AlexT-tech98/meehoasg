name: Meehoa Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build consolidated runtime assets
        run: node scripts/build-runtime.cjs
      - name: Run regression suite
        run: node --test tests/*.test.cjs
      - name: Persist generated runtime bundle on refactor branch
        if: github.event_name == 'pull_request' && github.head_ref == 'refactor/consolidate-production-core-20261003'
        run: |
          if [ -z "$(git status --porcelain -- assets/meehoa-core.css assets/meehoa-core.js runtime-metrics.json)" ]; then
            echo "Runtime bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/meehoa-core.css assets/meehoa-core.js runtime-metrics.json
          git commit -m "build: refresh consolidated runtime assets"
          git push origin HEAD:${{ github.head_ref }}
