<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEEHOASG · Operations Platform</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff9ef,#fff2f6 48%,#eef9f4);color:#2c2724}.prod-boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.prod-mark{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#2e705c,#ef8998);color:white;font-weight:800;font-size:20px;box-shadow:0 14px 34px rgba(46,112,92,.18)}
</style>
</head>
<body>
<div class="prod-boot"><div class="prod-mark">M</div></div>
<script>
(async function(){
  try{
    var r=await fetch('/html?app-base='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Không tải được hệ thống');
    var html=await r.text();
    html=html.replace(/<head>/i,'<head><base href="/">');
    html=html.replace(/<\/head>/i,'<link rel="stylesheet" href="/preview/assets/ui-v3.css?v=3.5"><link rel="stylesheet" href="/preview/assets/ui-v3-fix.css?v=3.5"><link rel="stylesheet" href="/preview/assets/ui-v3-hotfix.css?v=3.5"><link rel="stylesheet" href="/preview/assets/ui-v34.css?v=3.5"><link rel="stylesheet" href="/preview/assets/ui-v35.css?v=3.5"></head>');
    html=html.replace(/<\/body>/i,'<script src="/preview/assets/ui-v3.js?v=3.5"><\/script><script src="/preview/assets/ui-v34.js?v=3.5"><\/script><script src="/preview/assets/ui-v35.js?v=3.5"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="prod-boot"><div style="padding:20px 24px;border-radius:20px;background:#fff;box-shadow:0 18px 55px rgba(70,46,39,.12)"><b>Không mở được Meehoa Ops</b><div style="margin-top:6px;color:#85776f;font-size:13px">'+String(e&&e.message||e)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
