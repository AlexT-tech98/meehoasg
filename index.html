<style>html,body{margin:0;min-height:100%;background:#fffaf5}body{visibility:hidden}</style>
<script>
(async function(){
  try{
    var r=await fetch('/html?prod-base=20260929-v38',{cache:'no-store'});
    if(!r.ok) throw new Error('Không tải được ứng dụng');

      '<link rel="stylesheet" href="/assets/meehoa-v35.css?v=3.8">'+
      '<link rel="stylesheet" href="/assets/meehoa-prod-fix.css?v=3.8">'+
      '</head>');
    html=html.replace(/<\/body>/i,
      '<script src="/assets/meehoa-v3.js?v=3.8"><\/script>'+
      '<script src="/assets/meehoa-v34.js?v=3.8"><\/script>'+
      '<script src="/assets/meehoa-v35.js?v=3.8"><\/script>'+
      '<script>document.body.style.visibility="visible";<\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.style.visibility='visible';
    document.body.innerHTML='<div style="min-height:100dvh;display:grid;place-items:center;font:14px system-ui;color:#5d514b">Không tải được ứng dụng. Vui lòng tải lại trang.</div>';
  }
})();
