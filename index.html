<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meehoa OPS">
<title>Meehoa OPS</title>
<link rel="icon" type="image/svg+xml" href="/assets/meehoa-mark.svg?v=7">
<link rel="apple-touch-icon" href="/assets/meehoa-mark.svg?v=7">
<link rel="manifest" href="/manifest.webmanifest?v=7">
<link rel="preconnect" href="https://zxnfhshnavbmvdthrmrd.supabase.co" crossorigin>
<link rel="preload" href="/html?prod-base=20261103-complete-plan-3" as="fetch">
<link rel="preload" href="/assets/meehoa-core.css?v=20261103-complete-plan-3" as="style">
<link rel="preload" href="/assets/meehoa-core.js?v=20261103-complete-plan-3" as="script">
<style>
html,body{margin:0;min-height:100%;background:#f6f7f9;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#meeBoot{min-height:100dvh;background:#f6f7f9}
#meeBootError{display:none;min-height:100dvh;place-items:center;padding:24px;color:#443a35;background:#f6f7f9;text-align:center}
#meeBootError.show{display:grid}
</style>
<script>
(function(){
  var RELEASE='20261103-complete-plan-3';
  var SHELL_KEY='meehoa-shell-core-'+RELEASE;
  var SHELL_URL='/html?prod-base='+RELEASE;
  var API_LEGACY='https://zxnfhshnavbmvdthrmrd.supabase.co/functions/v1/meehoasg-api';
  var API_CORE='https://meehoasg-api-gateway.meehoasg.workers.dev';
  var OLD_SPLASH='<div id="bootSplash" class="boot-splash hidden"><div class="boot-splash-card"><div class="brand-mark">M</div><div><div>MEEHOASG</div><small id="bootSplashText" class="sub">Đang mở dữ liệu hôm nay…</small></div></div></div>';
  var NEW_SPLASH='<div id="bootSplash" class="boot-splash hidden">'+
    '<span class="mee-splash-pet mee-splash-cat" style="display:none" aria-hidden="true"></span>'+
    '<span class="mee-splash-pet mee-splash-dog" style="display:none" aria-hidden="true"></span>'+
    '<div class="boot-splash-card mee-splash-card">'+
      '<div class="mee-splash-badge">MEEHOA · VẬN HÀNH MỖI NGÀY</div>'+
      '<div class="mee-splash-logo"><img src="/assets/meehoa-mark.svg?v=7" alt="Meehoa"></div>'+
      '<div class="mee-splash-title">MEEHOA OPS</div>'+
      '<small id="bootSplashText" class="sub">Đang mở Meehoa Ops…</small>'+
      '<div class="mee-splash-progress" aria-hidden="true"><i></i><i></i><i></i></div>'+
    '</div></div>';
  function prepare(html){
    html=html.replaceAll(API_LEGACY,API_CORE);
    html=html.replaceAll('https://zxnfhshnavbmvdthrmrd.supabase.co/functions/v1/meehoasg-api-core',API_CORE);
    html=html.replace(OLD_SPLASH,NEW_SPLASH);
    html=html.replace(/window\.__MEE_BOOT_STAGE__\s*=\s*'ready';/,
      "window.S=S;window.gas=gas;window.loadFlowers=loadFlowers;window.loadPage=loadPage;window.renderProduction=renderProduction;window.rememberOrders=rememberOrders;window.validateBuild=validateBuild;window.closeOverlay=closeOverlay;window.toast=toast;window.__MEE_BOOT_STAGE__='ready';");
    html=html.replace(/<head>/i,'<head><base href="/"><meta name="theme-color" content="#050b17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meehoa OPS"><link rel="icon" type="image/svg+xml" href="/assets/meehoa-mark.svg?v=7"><link rel="apple-touch-icon" href="/assets/meehoa-mark.svg?v=7"><link rel="manifest" href="/manifest.webmanifest?v=7">');
    html=html.replace(/<title>[^<]*<\/title>/i,'<title>Meehoa OPS</title>');
    html=html.replace(/<\/head>/i,'<link rel="stylesheet" href="/assets/meehoa-core.css?v=20261103-complete-plan-3"></head>');
    html=html.replace(/<\/body>/i,'<script src="/assets/meehoa-core.js?v=20261103-complete-plan-3"><\/script></body>');
    return html;
  }
  function mount(raw){document.open();document.write(prepare(raw));document.close()}
  async function boot(){
    try{
      var cached='';try{cached=localStorage.getItem(SHELL_KEY)||''}catch(_){ }
      var html='';
      try{
        var r=await fetch(SHELL_URL,{cache:'no-store'});if(!r.ok)throw new Error('Không tải được ứng dụng');
        html=await r.text();try{localStorage.setItem(SHELL_KEY,html)}catch(_){ }
      }catch(error){if(!cached)throw error;html=cached}
      mount(html);
    }catch(e){
      var x=document.getElementById('meeBootError');if(x)x.classList.add('show');
    }
  }
  window.addEventListener('DOMContentLoaded',boot,{once:true});
})();
</script>
</head>
<body>
<div id="meeBoot"></div>
<div id="meeBootError"><div><b>Chưa vào được Meehoa</b><br><small>Vui lòng tải lại trang một lần.</small></div></div>
</body>
</html>
